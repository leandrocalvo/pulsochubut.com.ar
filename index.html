<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulso Chubut</title>

  <meta http-equiv="refresh" content="3;url=https://pulsochubut.ar" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #0d1b2a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .container { max-width: 480px; }

    .logo {
      font-family: 'Georgia', serif;
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    .logo span { color: #e63946; }

    .tagline {
      font-size: 0.85rem;
      color: #8a9ab0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .message {
      font-size: 1rem;
      color: #c9d6e3;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .bar-container {
      width: 100%;
      height: 3px;
      background: #1e2e40;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #e63946;
      border-radius: 2px;
      animation: fillBar 3s linear forwards;
    }

    @keyframes fillBar { to { width: 100%; } }

    .link { font-size: 0.9rem; color: #8a9ab0; }

    .link a {
      color: #e63946;
      text-decoration: none;
      font-weight: bold;
    }

    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Pulso<span>Chubut</span></div>
    <div class="tagline">Periodismo del sur</div>

    <p class="message">
      Nos mudamos a una nueva dirección.<br />
      En un momento serás redirigido automáticamente.
    </p>

    <div class="bar-container">
      <div class="bar"></div>
    </div>

    <p class="link">
      Si no eres redirigido, <a href="https://pulsochubut.ar">hacé clic aquí</a>.
    </p>
  </div>
</body>
</html>
